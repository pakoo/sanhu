name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            asset_name: sanhu-windows-amd64
          - goos: windows
            goarch: arm64
            suffix: .exe
            asset_name: sanhu-windows-arm64
          - goos: darwin
            goarch: amd64
            suffix: ""
            asset_name: sanhu-darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: ""
            asset_name: sanhu-darwin-arm64
          - goos: linux
            goarch: amd64
            suffix: ""
            asset_name: sanhu-linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ""
            asset_name: sanhu-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.gitTag=${GITHUB_REF_NAME}" \
            -o sanhu${{ matrix.suffix }} \
            ./cmd/sanhu/

      # 压缩包内的可执行文件统一叫 sanhu / sanhu.exe：
      #  - updater 解压时按这个名字找二进制（internal/updater/extract.go looksLikeBinary）
      #  - macOS 装进 .app 后路径是 sanhu.app/Contents/MacOS/sanhu，basename 仍是 sanhu，
      #    所以自动更新照样能认出来
      - name: Package (Windows zip)
        if: matrix.goos == 'windows'
        run: |
          mkdir -p dist
          cp sanhu.exe dist/sanhu.exe
          cp packaging/windows/使用说明.txt dist/ 2>/dev/null || true
          cd dist && zip -9 -r ../${{ matrix.asset_name }}.zip .

      # macOS 打成 .app：下载解压后双击即用，不需要开终端。
      # CFBundleExecutable 直接指向 Go 二进制——程序自己会开浏览器（cmd/sanhu/launch.go），
      # 不再需要额外的 shell 启动器。
      - name: Package (macOS .app)
        if: matrix.goos == 'darwin'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APP=dist/sanhu.app
          mkdir -p "$APP/Contents/MacOS"
          cp sanhu "$APP/Contents/MacOS/sanhu"
          chmod +x "$APP/Contents/MacOS/sanhu"
          sed -e "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp packaging/macos/使用说明.txt dist/ 2>/dev/null || true
          cd dist && zip -9 -ry ../${{ matrix.asset_name }}.zip .

      - name: Package (Linux tar.gz)
        if: matrix.goos == 'linux'
        run: |
          mkdir -p dist
          cp sanhu dist/sanhu
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist sanhu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.goos == 'linux' && 'tar.gz' || 'zip' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # 初始数据已内嵌进二进制（embed.go SeedSQLGz），首启不再下载；
          # 仍附带 seed.sql.gz 作为可选资产，供内网镜像用 SANHU_SEED_URL 指过来。
          files: |
            artifacts/*/sanhu-*.zip
            artifacts/*/sanhu-*.tar.gz
            seed/seed.sql.gz
