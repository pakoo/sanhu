name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            asset_name: sanhu-windows-amd64
          - goos: windows
            goarch: arm64
            suffix: .exe
            asset_name: sanhu-windows-arm64
          - goos: darwin
            goarch: amd64
            suffix: ""
            asset_name: sanhu-darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: ""
            asset_name: sanhu-darwin-arm64
          - goos: linux
            goarch: amd64
            suffix: ""
            asset_name: sanhu-linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ""
            asset_name: sanhu-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.gitTag=${GITHUB_REF_NAME}" \
            -o sanhu${{ matrix.suffix }} \
            ./cmd/sanhu/

      # 压缩包内的可执行文件统一叫 sanhu / sanhu.exe：
      #  - 与 README 里「解压后运行 ./sanhu」一致
      #  - updater 解压时按这个名字找二进制（internal/updater/extract.go looksLikeBinary）
      - name: Package (Windows zip)
        if: matrix.goos == 'windows'
        run: |
          mkdir -p dist
          cp sanhu.exe dist/sanhu.exe
          cd dist && zip -9 ../${{ matrix.asset_name }}.zip sanhu.exe

      - name: Package (Unix tar.gz)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p dist
          cp sanhu dist/sanhu
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist sanhu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # 初始数据已内嵌进二进制（embed.go SeedSQLGz），首启不再下载；
          # 仍附带 seed.sql.gz 作为可选资产，供内网镜像用 SANHU_SEED_URL 指过来。
          files: |
            artifacts/*/sanhu-*.zip
            artifacts/*/sanhu-*.tar.gz
            seed/seed.sql.gz
